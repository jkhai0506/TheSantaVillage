<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dce6f7"><title>The Santa Village — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--sky:#dce6f7;--ink:#514b50;--sage:#8fa87c;--coral:#cf6a5a;--cream:#fff8e9;--gold:#d8b66b;--paper:#fffdf5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100vh;background:linear-gradient(180deg,#b9d0ec 0%,#e8f0f7 48%,#fff5d6 100%);color:var(--ink);font-family:'Gaegu',cursive;display:grid;place-items:center;overflow:hidden;position:relative}
.snow{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff9 1px,transparent 2px);background-size:97px 97px,61px 61px;background-position:0 0,30px 40px;animation:drift 18s linear infinite;opacity:.75}@keyframes drift{to{background-position:0 300px,30px 340px}}
.scene{width:min(92vw,760px);min-height: min(88vh,760px);padding:clamp(26px,6vw,58px) 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:1;background:#fffdf5d9;border:2px solid #fff;border-radius:48% 48% 25px 25px/18% 18% 25px 25px;box-shadow:0 12px 40px #7488a533}
.kicker{font-size:clamp(19px,3vw,25px);letter-spacing:3px;color:var(--sage);font-weight:700;margin:0 0 4px}.title{font-size:clamp(48px,10vw,82px);line-height:.95;color:var(--coral);font-weight:700;margin:0;text-shadow:2px 3px 0 #f1d9c8}.subtitle{font-size:clamp(23px,4vw,32px);margin:18px 0 4px;color:var(--ink)}.script{font-family:'Pinyon Script',cursive;color:var(--sage);font-size:clamp(34px,6vw,49px);margin:0}
.village{width:min(72vw,330px);height:auto;margin:12px auto 4px}.foot{font-size:clamp(18px,3vw,23px);color:#8a7a60;margin:10px 0 0}.ornament{position:absolute;color:var(--gold);font-size:clamp(22px,4vw,34px);animation:twinkle 2.6s ease-in-out infinite alternate}.a{left:10%;top:15%}.b{right:10%;top:22%;animation-delay:.7s}.c{left:14%;bottom:16%;animation-delay:1.2s}.d{right:13%;bottom:18%;animation-delay:.4s}@keyframes twinkle{to{transform:rotate(18deg) scale(1.2);opacity:.55}}
</style></head><body><div class="snow" aria-hidden="true"></div><main class="scene"><span class="ornament a" aria-hidden="true">✦</span><span class="ornament b" aria-hidden="true">❄</span><span class="ornament c" aria-hidden="true">✧</span><span class="ornament d" aria-hidden="true">✦</span>
<p class="kicker">✦ THE SANTA VILLAGE ✦</p><h1 class="title">COMING<br>SOON</h1>
<svg class="village" viewBox="0 0 400 300" role="img" aria-label="A little pastel Christmas village illustration">
<path d="M35 240 Q95 210 155 235 T280 225 T390 235 V300 H35Z" fill="#d3e2b6"/><path d="M95 142 L200 55 305 142Z" fill="#c98f7a" stroke="#8a7a60" stroke-width="4"/><path d="M115 140 H285 V255 H115Z" fill="#efe3bf" stroke="#8a7a60" stroke-width="4"/><path d="M170 255 V190 Q200 160 230 190 V255" fill="#cf6a5a" stroke="#8a7a60" stroke-width="4"/><rect x="132" y="160" width="38" height="42" rx="3" fill="#b9d0ec" stroke="#8a7a60" stroke-width="3"/><path d="M151 160v42m-19-21h38" stroke="#fffdf5" stroke-width="3"/><rect x="232" y="160" width="38" height="42" rx="3" fill="#b9d0ec" stroke="#8a7a60" stroke-width="3"/><path d="M251 160v42m-19-21h38" stroke="#fffdf5" stroke-width="3"/><path d="M185 56 Q200 25 215 56" fill="none" stroke="#8fa87c" stroke-width="8"/><path d="M200 32 l7 12 -14 0z" fill="#d8b66b"/>
<g fill="#8fa87c"><path d="M45 235l25-70 25 70zM58 212l12-55 12 55zM310 235l28-78 28 78zM323 211l15-60 15 60z"/></g><g fill="#cf6a5a"><circle cx="68" cy="205" r="5"/><circle cx="338" cy="198" r="5"/></g><g fill="#fff"><circle cx="55" cy="75" r="4"/><circle cx="330" cy="65" r="4"/><circle cx="285" cy="105" r="3"/></g></svg>
<p class="subtitle">A little Christmas magic is on its way...</p><p class="script">See you on Event Day!</p><p class="foot">❄ &nbsp; Until then, let the magic begin. &nbsp; ❄</p></main></body></html>
